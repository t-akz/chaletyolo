# Configuration Netlify — Chalet Yolo
# Netlify lit ce fichier à chaque déploiement.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Fonctions serveur de l'admin des tarifs (/api/admin/…), voir README « Admin des tarifs ».
# Elles utilisent le stockage Netlify Blobs et les variables ADMIN_PASSWORD,
# ADMIN_SECRET et BUILD_HOOK_URL (réglages du site Netlify, jamais dans le code).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# En-têtes de sécurité appliqués à toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Admin des tarifs : jamais indexée, jamais mise en cache.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Fichiers générés par Astro (CSS, JS, images optimisées) : leur nom change à
# chaque modification, on peut donc les mettre en cache pendant un an.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

